name: Pre-production Docker

on:
  push:
    branches: [pre]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ijm2api-pre-production
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: btcfoxman
  IMAGE_NAME: ijm2api
  DEPLOY_PATH: /home/btcfoxman/docker/ijm2api
  DEPLOY_SERVICE: ijm2api
  IJM2API_HOSTNAME: ijm2api.aiid.edu.kg
  IJM2API_ORIGIN: http://127.0.0.1:8808

jobs:
  build:
    runs-on: [self-hosted, linux, x64, ijm2api-pre]
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/btcfoxman/ijm2api"
          docker build --network=host \
            --build-arg HTTP_PROXY=http://127.0.0.1:10809 \
            --build-arg HTTPS_PROXY=http://127.0.0.1:10809 \
            -t "$image:${{ github.sha }}" -t "$image:latest" .
          docker push "$image:${{ github.sha }}"
          docker push "$image:latest"

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, ijm2api-pre]
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare compose project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_PATH"
          test -f "$DEPLOY_PATH/.env"
          cp docker-compose.yml "$DEPLOY_PATH/docker-compose.yml"
          docker network inspect my-shared-net >/dev/null 2>&1 || docker network create my-shared-net
      - name: Wait for in-flight video tasks
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(docker inspect -f '{{.State.Running}}' "$DEPLOY_SERVICE" 2>/dev/null || true)" != true ]; then
            exit 0
          fi
          active_tasks() {
            docker exec -i "$DEPLOY_SERVICE" python - <<'PY'
          import sqlite3
          db = sqlite3.connect('file:/app/data/ijm2api.db?mode=ro', uri=True, timeout=10)
          print(db.execute("SELECT COUNT(*) FROM tasks WHERE status IN ('queued','preparing','submitted','running')").fetchone()[0])
          PY
          }
          deadline=$((SECONDS + 1200))
          while true; do
            active="$(active_tasks)"
            echo "IJM2API active tasks: $active"
            if [ "$active" -eq 0 ]; then
              sleep 20
              if [ "$(active_tasks)" -eq 0 ]; then
                break
              fi
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Refusing to restart IJM2API while tasks are active"
              exit 1
            fi
            sleep 15
          done
      - name: Pull and start
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          IMAGE_REGISTRY="$IMAGE_REGISTRY" IMAGE_NAMESPACE="$IMAGE_NAMESPACE" IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" docker compose pull "$DEPLOY_SERVICE"
          IMAGE_REGISTRY="$IMAGE_REGISTRY" IMAGE_NAMESPACE="$IMAGE_NAMESPACE" IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" docker compose up -d "$DEPLOY_SERVICE"
      - name: Verify service
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 "$IJM2API_ORIGIN/health" >/dev/null; then exit 0; fi
            sleep 5
          done
          docker logs --tail 120 ijm2api
          exit 1
      - name: Configure cloudflared ingress
        shell: bash
        env:
          HTTP_PROXY: http://127.0.0.1:10809
          HTTPS_PROXY: http://127.0.0.1:10809
        run: bash scripts/configure_cloudflared.sh
      - name: Verify public endpoint
        shell: bash
        env:
          HTTP_PROXY: http://127.0.0.1:10809
          HTTPS_PROXY: http://127.0.0.1:10809
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "https://${IJM2API_HOSTNAME}/health" >/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
