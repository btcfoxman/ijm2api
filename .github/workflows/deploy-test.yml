name: Pre-production Docker

on:
  push:
    branches: [pre]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ijm2api-pre-production
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: btcfoxman
  IMAGE_NAME: ijm2api
  DEPLOY_PATH: /home/btcfoxman/docker/ijm2api
  DEPLOY_SERVICE: ijm2api
  IJM2API_HOSTNAME: ijm2api.aiid.edu.kg
  IJM2API_ORIGIN: http://127.0.0.1:8808

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, ijm2api-ci-pre35]
    timeout-minutes: 35
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Verify isolated build capacity
        id: build_capacity
        shell: bash
        run: |
          set -euo pipefail
          for path in "$RUNNER_TEMP" "$GITHUB_WORKSPACE"; do
            available_bytes="$(df -PB1 "$path" | awk 'NR==2 {print $4}')"
            [[ "$available_bytes" =~ ^[0-9]+$ ]]
            if (( available_bytes < 15 * 1024 * 1024 * 1024 )); then
              echo "Isolated build runner requires at least 15 GiB free disk."
              exit 1
            fi
          done
          printf 'builder=ijm2api-%s-%s\n' "${GITHUB_SHA:0:12}" "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify application
        env:
          IJM_API_KEY: ci-only-api-key
          IJM_ADMIN_TOKEN: ci-only-admin-token
          IJM_DATA_DIR: /tmp/ijm2api-ci
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
          node --test tests/*.js
          python -m compileall -q app
          bash -n scripts/deploy_pre.sh
      - name: Verify pinned Canvas account proxy tracer
        run: |
          python tools/install_canvas_proxy.py --destination "$RUNNER_TEMP/canvas-proxy/graftcp" --license-directory "$RUNNER_TEMP/canvas-proxy/licenses"
          "$RUNNER_TEMP/canvas-proxy/graftcp" --version
          "$RUNNER_TEMP/canvas-proxy/graftcp" --config /dev/null --select_proxy_mode only_http_proxy --http_proxy 127.0.0.1:9 -- /bin/true
      - uses: docker/setup-buildx-action@v3
        with:
          name: ${{ steps.build_capacity.outputs.builder }}
          driver: docker-container
          driver-opts: |
            memory=2g
            memory-swap=2g
            cpu-period=100000
            cpu-quota=200000
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Build and push verified image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/btcfoxman/ijm2api:${{ github.sha }}
            ghcr.io/btcfoxman/ijm2api:pre
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, ijm2api-pre]
    timeout-minutes: 150
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      DEPLOY_WAIT_SECONDS: ${{ vars.DEPLOY_WAIT_SECONDS || '7200' }}
    steps:
      - uses: actions/checkout@v4
      - name: Isolate registry credentials
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/ijm2api-docker-auth" >> "$GITHUB_ENV"
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Pull image and wait for an idle service before restart
        shell: bash
        run: bash scripts/deploy_pre.sh
      - name: Verify existing public endpoint
        shell: bash
        env:
          HTTP_PROXY: http://127.0.0.1:10809
          HTTPS_PROXY: http://127.0.0.1:10809
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if curl -fsS --connect-timeout 3 --max-time 8 "https://${IJM2API_HOSTNAME}/health" >/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
