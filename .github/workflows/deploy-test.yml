name: Pre-production Docker

on:
  push:
    branches: [pre]
  workflow_dispatch:
    inputs:
      query_only_task_ids:
        description: 'Explicit JSON array of already accepted Canvas local task IDs; empty keeps strict idle deployment'
        required: false
        default: ''
        type: string
      smoke_only_image_tag:
        description: 'Diagnostic only: run hosted synthetic Docker smoke against an existing same-repository 40-hex image tag; never deploy'
        required: false
        default: ''
        type: string
      reuse_image_tag:
        description: 'Reuse an existing same-repository 40-hex image only after exact build-context comparison; still run full validation and Docker smoke'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ijm2api-pre-production
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: btcfoxman
  IMAGE_NAME: ijm2api
  DEPLOY_PATH: /home/btcfoxman/docker/ijm2api
  DEPLOY_SERVICE: ijm2api
  IJM2API_HOSTNAME: ijm2api.aiid.edu.kg
  IJM2API_ORIGIN: http://127.0.0.1:8808

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image_tag: ${{ steps.image_selection.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate diagnostic image selection
        id: image_selection
        shell: bash
        env:
          SMOKE_ONLY_IMAGE_TAG: ${{ inputs.smoke_only_image_tag }}
          REUSE_IMAGE_TAG: ${{ inputs.reuse_image_tag }}
        run: |
          set -euo pipefail
          if [ -n "$SMOKE_ONLY_IMAGE_TAG" ] && [ -n "$REUSE_IMAGE_TAG" ]; then
            echo "Smoke-only and image reuse modes are mutually exclusive"
            exit 1
          fi
          if [ -n "$SMOKE_ONLY_IMAGE_TAG" ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            [[ "$SMOKE_ONLY_IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          fi
          if [ -n "$REUSE_IMAGE_TAG" ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            [[ "$REUSE_IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
            git fetch --quiet --no-tags origin "$REUSE_IMAGE_TAG"
            git diff --quiet "$REUSE_IMAGE_TAG" "$GITHUB_SHA" -- app Dockerfile .dockerignore requirements.txt tools/install_canvas_cli.py tools/install_canvas_proxy.py tools/build_canvas_proxy.py tools/stress_canvas_proxy.py tools/test_canvas_proxy_image.py tools/patches/graftcp-0.8.3-thread-pinning.patch
            echo "image_tag=$REUSE_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: ${{ inputs.smoke_only_image_tag == '' }}
        with:
          node-version: '22.23.4'
      - name: Verify validation runtimes
        if: ${{ inputs.smoke_only_image_tag == '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          node -e 'if (process.version !== "v22.23.4") process.exit(1)'
      - name: Verify application
        if: ${{ inputs.smoke_only_image_tag == '' }}
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          IJM_API_KEY: ci-only-api-key
          IJM_ADMIN_TOKEN: ci-only-admin-token
          IJM_DATA_DIR: /tmp/ijm2api-ci
        run: |
          python -m pip install --index-url https://pypi.org/simple --timeout 30 --retries 2 -r requirements-dev.txt
          python -m pytest -q
          node --test tests/*.js
          node --check app/static/app.js
          python -m compileall -q app
          bash -n scripts/deploy_pre.sh
      - uses: actions/setup-go@v5
        if: ${{ inputs.smoke_only_image_tag == '' && inputs.reuse_image_tag == '' }}
        with:
          go-version: '1.25.x'
          cache: false
      - name: Build and stress-test the thread-pinned Canvas account proxy
        if: ${{ inputs.smoke_only_image_tag == '' && inputs.reuse_image_tag == '' }}
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          command -v make
          command -v gcc
          python tools/install_canvas_proxy.py --destination "$RUNNER_TEMP/canvas-proxy/graftcp" --license-directory "$RUNNER_TEMP/canvas-proxy/licenses"
          python tools/install_canvas_cli.py --destination "$RUNNER_TEMP/canvas-proxy/dreamina-canvas"
          python tools/build_canvas_proxy.py --destination .canvas-proxy-build --comparison-directory .canvas-proxy-comparison
          python tools/stress_canvas_proxy.py --release "$RUNNER_TEMP/canvas-proxy/graftcp" --original .canvas-proxy-comparison/graftcp-unpatched --patched .canvas-proxy-build/graftcp --cli "$RUNNER_TEMP/canvas-proxy/dreamina-canvas" --count 500 --workers 8 --output .canvas-proxy-comparison/stress-results.json
          cp .canvas-proxy-comparison/stress-results.json .canvas-proxy-build/docs/offline-stress.json
          python tools/build_canvas_proxy.py --verify-only .canvas-proxy-build
      - name: Preserve Canvas proxy source, patch and stress proof
        if: ${{ always() && inputs.smoke_only_image_tag == '' && inputs.reuse_image_tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: canvas-proxy-provenance
          include-hidden-files: true
          path: |
            .canvas-proxy-build/docs
            .canvas-proxy-comparison/stress-results.json
          if-no-files-found: warn
      - uses: docker/setup-buildx-action@v3
        if: ${{ inputs.smoke_only_image_tag == '' && inputs.reuse_image_tag == '' }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Select verified same-day runtime dependencies
        id: runtime_selection
        if: ${{ inputs.smoke_only_image_tag == '' && inputs.reuse_image_tag == '' }}
        run: python tools/select_verified_runtime.py
      - name: Build and push verified image
        if: ${{ inputs.smoke_only_image_tag == '' && inputs.reuse_image_tag == '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.runtime_selection.outputs.dockerfile }}
          build-args: ${{ steps.runtime_selection.outputs.build_args }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/btcfoxman/ijm2api:${{ github.sha }}
            ghcr.io/btcfoxman/ijm2api:pre
          provenance: false
          sbom: false
      - name: Verify frozen cutover with real Docker on hosted runner
        shell: bash
        env:
          SMOKE_ONLY_IMAGE_TAG: ${{ inputs.smoke_only_image_tag }}
          SELECTED_IMAGE_TAG: ${{ steps.image_selection.outputs.image_tag }}
        run: |
          set -euo pipefail
          tag="${SMOKE_ONLY_IMAGE_TAG:-$SELECTED_IMAGE_TAG}"
          [[ "$tag" =~ ^[0-9a-f]{40}$ ]]
          image="$IMAGE_REGISTRY/$IMAGE_NAMESPACE/$IMAGE_NAME:$tag"
          docker pull "$image"
          python tools/test_canvas_proxy_image.py --image "$image" --output "$RUNNER_TEMP/canvas-proxy-image-smoke.json"
          python tools/test_deploy_freeze_runtime.py --image "$image"
      - name: Preserve final-image proxy smoke proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-proxy-final-image-proof
          path: ${{ runner.temp }}/canvas-proxy-image-smoke.json
          if-no-files-found: warn

  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' && inputs.smoke_only_image_tag == '' }}
    runs-on: [self-hosted, linux, x64, ijm2api-pre]
    timeout-minutes: 150
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      DEPLOY_WAIT_SECONDS: ${{ vars.DEPLOY_WAIT_SECONDS || '7200' }}
      IJM_DEPLOY_QUERY_ONLY_TASK_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.query_only_task_ids || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Isolate registry credentials
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/ijm2api-docker-auth" >> "$GITHUB_ENV"
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Pull image and wait for an idle service before restart
        shell: bash
        run: bash scripts/deploy_pre.sh
      - name: Verify existing public endpoint
        shell: bash
        env:
          HTTP_PROXY: http://127.0.0.1:10809
          HTTPS_PROXY: http://127.0.0.1:10809
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if curl -fsS --connect-timeout 3 --max-time 8 "https://${IJM2API_HOSTNAME}/health" >/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
